# Production Deployment CI/CD Workflow for Vercel
# Controlled release pipeline. Requires manual trigger via GitHub Actions UI (workflow_dispatch).
# Runs comprehensive verification before deploying prebuilt artifacts to Vercel Production.

name: Vercel Production Deployment

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for production deployment'
        required: false
        default: 'Approved production release'

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify and Deploy to Production
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting Checks
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Security Tests
        run: npm test

      - name: Run Production Dependency Audit
        run: npm audit --omit=dev

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Configuration
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Prebuilt Artifacts to Vercel Production
        run: vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
