# ==============================================================================
# Astraiv Technologies — Admin Portal CI/CD & Verification Pipeline
# ==============================================================================
# Triggers on:
# 1. Direct pushes to main (Automatic CI -> Production Deployment -> Smoke Tests)
# 2. Pull Requests targeting main (CI verification ONLY, NO deployment)
# 3. Manual workflow_dispatch (Controlled manual trigger / recovery)

name: Admin CI/CD & Production Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual release trigger'

permissions:
  contents: read

concurrency:
  group: admin-production-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ============================================================================
  # STAGE 1: Continuous Integration (Runs on PRs, Pushes to main, & Manual)
  # ============================================================================
  ci:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting Checks
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Security & Regression Tests
        run: npm test

      - name: Run Production Dependency Audit
        run: npm audit --omit=dev

      - name: Verify Production Build
        run: npm run build
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/astraiv_db'

  # ============================================================================
  # STAGE 2: Production Deployment (Runs ONLY on successful CI for push to main)
  # ============================================================================
  deploy:
    name: Deploy to Vercel Production
    needs: [ci]
    if: |
      always() && 
      needs.ci.result == 'success' && 
      (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest

    outputs:
      deployment_url: ${{ steps.deploy_step.outputs.url }}

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout Verified Commit
        uses: actions/checkout@v4

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Production Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Production Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Prebuilt Artifacts to Vercel Production
        id: deploy_step
        run: |
          DEPLOY_OUTPUT=$(vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -E '^https?://' | tail -n 1)
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="$DEPLOY_OUTPUT"
          fi
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "Successfully deployed to: $DEPLOY_URL"

          # Explicitly alias custom production domains to eliminate any branch-lock or promotion delays
          echo "Binding custom domains to new production deployment..."
          vercel alias set "$DEPLOY_URL" superuser.admin.astraivtechnologies.com --token=${{ secrets.VERCEL_TOKEN }} || true

  # ============================================================================
  # STAGE 3: Post-Deployment Automated Smoke Tests
  # ============================================================================
  smoke-test:
    name: Post-Deployment Smoke Verification
    needs: [deploy]
    if: |
      always() && 
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Run Automated Smoke Tests Against Production
        run: node scripts/post-deploy-verify.mjs
        env:
          DEPLOYMENT_URL: 'https://superuser.admin.astraivtechnologies.com'
          DIRECT_DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
