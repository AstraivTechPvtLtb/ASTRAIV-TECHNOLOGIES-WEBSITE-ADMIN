# Continuous Integration (CI) Workflow
# Validates code quality, types, tests, dependencies, and production build.
# Runs on Pull Requests and direct pushes to main.
# Requires NO deployment tokens or cloud credentials (safe for all developers).

name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting Checks
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Security & Regression Tests
        run: npm test

      - name: Run Production Dependency Audit
        run: npm audit --omit=dev

      - name: Verify Production Build
        run: npm run build
